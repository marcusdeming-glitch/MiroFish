services:
  mirofish:
    # Build from local source (required for portfolio analysis module)
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: use pre-built image (does NOT include portfolio analysis)
    # image: ghcr.io/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"   # Frontend (Vite)
      - "5001:5001"   # Backend API (Flask)
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
